[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, B: bugbear,
# UP: pyupgrade, C4: comprehensions. E501 (line length) is handled by the
# formatter; keep it off to avoid noise on long prompt strings.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# Demo blocks intentionally keep broad structure; tests may shadow names.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
